appId: com.ideaswork.ideanote
productName: IdeaNote
directories:
  output: out/electron-builder
icon: assets/icon.png
files:
  - dist/**/*
  - index.html
  - assets/**/*
  - package.json
  - main.js
asar: true
asarUnpack:
  # 只解压真正需要的原生模块
  - 'node_modules/@xenova/transformers/**/*.node'
  - 'node_modules/**/*.dll'
  # - '**/*.{node,dll}'
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
win:
  target:
    - target: nsis
      arch: [x64, ia32]
  icon: assets/icon.png
  # 添加 Windows 特定优化
  extraResources:
    - from: assets
      to: assets
linux:
  target:
    - target: AppImage
      arch: [x64]